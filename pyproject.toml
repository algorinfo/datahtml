[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datahtml"
description = 'A lib to work with html and web data'
readme = "README.md"
requires-python = ">=3.8"
license = "MPL-2.0"
keywords = []
authors = [
  { name = "Xavier Petit", email = "nuxion@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  # "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "beautifulsoup4",
    "lxml",
	"ujson~=5.10.0",
	"extruct~=0.17.0",
	"feedparser",
	"httpx",
   	"pydantic>=2",
	"attrs",
]
dynamic = ["version"]

[project.optional-dependencies]
news = [
   "newspaper3k~=0.2.8",
]

[project.urls]
Documentation = "https://github.com/algorinfo/datahtml#readme"
Issues = "https://github.com/algorinfo/datahtml/issues"
Source = "https://github.com/algorinfo/datahtml"

[tool.hatch.version]
path = "datahtml/__about__.py"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "mypy~=1.0.1",
  "isort",
  "pylint>2.6.0",
  "black~=22.10.0",
  "black-macchiato",
  "ipython",
  "datahtml[news]",
]
docs = [
  "Sphinx~=5.3.0",
  "sphinx-autobuild",
  "sphinx-rtd-theme",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "datahtml/__about__.py",
]
[tool.isort]
profile = "black"

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
